seo:
  title: About Jennifer Schumacher — Scottsdale REALTOR®
  description: >-
    Twenty years in sales and marketing, Top 1% Arizona REALTOR®, and a
    partnership approach to buying and selling across Scottsdale, Paradise
    Valley, Phoenix and the East Valley.
  social_image: /assets/jennifer-mug.jpg
hero:
  kicker: About Jennifer
  headline_line1: People hire
  headline_emphasis: people.
  body: >-
    Real estate is rarely about square footage. It's about trust, timing, and
    having someone in your corner who treats your goals as her own. That's the
    whole job and it's the part I love most.
  image: /assets/0m4a2254.jpg
  image_alt: Jennifer Schumacher
why:
  kicker: Why real estate
  heading: A career built on serving people well.
  paragraphs:
    - text: >-
        Raised in North Dakota, I developed a relentless work ethic, a heart for
        people, and a drive for excellence. Over thirty years in sales &amp;
        marketing taught me how to position, market, and sell at the highest
        level, but it was the relationships that made me fall in love with the
        work.
    - text: >-
        My commitment goes beyond transactions. I create experiences that exceed
        expectations by listening, advising, and fiercely advocating for your
        best interests every step of the way. My goal is simple: to make your
        real estate experience seamless, stress-free, and successful.
areas:
  background_image: /assets/scottsdale-aerial.jpg
  kicker: Where she works
  heading: Deep roots across the Valley
  body: >-
    From Scottsdale and Paradise Valley to Phoenix, Gilbert, and the East
    Valley, I know where value lives, how each community trades, and what it
    takes to win in a competitive market.
  names:
    - name: Scottsdale
    - name: Paradise Valley
    - name: Phoenix
    - name: Arcadia
    - name: Sereno Canyon
    - name: East Valley
philosophy:
  kicker: My philosophy
  quote: >-
    "You deserve the very best. Thoughtful attention to detail, transparent
    communication, and powerful negotiation are the standard in everything I
    do."
