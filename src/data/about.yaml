team:
  kicker: The team
  heading: Jennifer & Natalie
  intro: >-
    Clients repeatedly praise "Jennifer and her team" — the partnership that
    makes every transaction feel effortless.
  photo: /assets/jennifer-natalie.jpg
  photo_alt: Jennifer Schumacher and Natalie Congleton
  members:
    - headshot: /assets/jennifer-mug.jpg
      name: Jennifer Schumacher
      role: Global Real Estate Advisor · Top 1% Arizona
      paragraphs:
        - >-
          Team lead with 20+ years in sales & marketing and a 2025 Top 50
          Scottsdale Real Producers honor — known for attention to detail,
          transparent communication, and powerful negotiation.
    - headshot: /assets/natalie-headshot.jpg
      name: Natalie Congleton
      role: Buyer's Specialist · President's Club 2025
      paragraphs:
        - >-
          Drawing from a multi-generational family background in real estate,
          Natalie's mission is to give every client a luxury experience —
          whether you're a first-time homebuyer or an experienced investor —
          specializing in Scottsdale, Paradise Valley, the East Valley, and
          greater Phoenix.
        - >-
          Born in Tucson and raised in Denver, she has deep Arizona roots and a
          strong connection to the Phoenix area she proudly calls home —
          supporting you from start to finish for a seamless, rewarding journey.
  support:
