fun_facts:
  kicker: Off the clock
  heading: A few things about me.
  items:
    - image: /assets/bts-gym.jpg
      title: Fitness
      body: >-
        A passion that fuels my energy and mindset every single day. A sweat a
        day keeps the doctor away!
    - image: /assets/bts-hike.jpg
      title: Adventure
      body: >-
        Always chasing the next challenge on and off the trail. Let's grab a
        hike together!
    - image: /assets/bts-lunch.jpg
      title: Travel
      body: >-
        Global travel broadens my perspective, inspires fresh ideas, and
        strengthens meaningful relationships with agents around the world!
    - image: /assets/bts-family.jpg
      title: Family
