team:
  kicker: The team
  heading: Jennifer &amp; Natalie
  intro: >-
    Clients repeatedly praise "Jennifer and her team" — the partnership that
    makes every transaction feel effortless.
  photo: /assets/0m4a0027-1.jpg
  photo_alt: Jennifer Schumacher and Natalie Congleton
  members:
    - headshot: /assets/0m4a2250.jpg
      name: Jennifer Schumacher
      role: Global Real Estate Advisor · Top 1% Arizona
      paragraphs:
        - >-
          With 30+ years of sales and marketing expertise and a decade ranked
          among Arizona’s Top 1% of Realtors, Jennifer brings proven strategy,
          meticulous attention to detail, and powerful negotiation to every
          transaction.
        - >-
          Ranked #34 among more than 53,000 Arizona Realtors and among the Top
          1% nationwide, Jennifer is also a member of Russ Lyon Sotheby’s
          International Realty’s prestigious Lyons Elite and Club 47,
          recognizing the company’s highest-performing agents. Her experience,
          strategic marketing, and commitment to exceptional service give buyers
          and sellers a distinct advantage.
    - headshot: /assets/0m4a0158-edit.jpg
      name: Natalie Congleton
      role: Buyer's Specialist · President's Club 2025
      paragraphs:
        - >-
          Drawing from a multi-generational family background in real estate,
          she is committed to maximizing value while creating a seamless
          experience for her clients. She has built her career on providing
          exceptional service and strategic guidance to every client she
          represents. She worked in Colorado & Arizona with new home builders
          for 6 years. 
        - >-
          She was recognized in the Russ Lyon Sotheby’s International Realty
          President's Club in 2024 & 2025. She was honored as a recipient of the
          2025 Scottsdale Area Association of REALTORS® 40 Under 40 Award,
          reflecting her dedication to excellence, professionalism, and client
          success. 
  support:
    - name: Ashly Bock
      role: Team Assistant
    - name: Beth Spivey
      role: Transaction Coordinator
cta:
  kicker: Let's talk
  heading: The best conversations start with hello.
  body: >-
    If we're the right fit, you'll feel it in the first ten minutes. Please
    reach out any time.
  image: /assets/0m4a0039-1.jpg
  button_call: Call
  button_text: Text Jennifer
