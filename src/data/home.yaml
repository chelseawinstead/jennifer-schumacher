seo:
  title: Jennifer Schumacher — Luxury Real Estate in Scottsdale & Phoenix
  description: >-
    Top 1% Arizona REALTOR® with Russ Lyon Sotheby's International Realty.
    Twenty years of sales and marketing expertise serving Scottsdale, Phoenix,
    Paradise Valley and the greater Valley.
  social_image: /assets/jennifer-portrait.png
hero:
  kicker: Top 1% REALTOR® · Scottsdale · Paradise valley · phoenix
  headline_line1: Arizona real estate,
  headline_emphasis: elevated.
  body: >-
    Whether buying your first home, expanding your portfolio, or selling an
    exceptional property, experience matters. With 30 years of sales and
    marketing mastery, an unrelenting eye for detail, and negotiation that
    fiercely protects what's yours.
  image: /assets/jennifer-portrait.png
  image_alt: Jennifer Schumacher
  button_call: Call Jennifer
  button_text: Text Jennifer
split:
  - kicker: For Buyers
    title: Buy A Home
    body: >-
      A guided path from search to keys, financing, inspection, appraisal, and a
      negotiator in your corner.
    cta: Learn more about buying →
    href: /buy
  - kicker: For Sellers
    title: Sell Your Home
    body: >-
      Positioned, marketed, and sold at the highest level with professional
      photography, video, and a data-driven strategy.
    cta: Learn more about selling →
    href: /sell
why:
  kicker: Why work with Jennifer
  heading: A dedicated partner, every step.
  items:
    - number: '01'
      title: Unwavering attention to detail
      body: >-
        Nothing slips. Every document, deadline, and detail is handled with
        precision so your transaction stays seamless.
    - number: '02'
      title: Transparent communication
      body: >-
        You are never guessing. Clear, proactive updates keep you informed and
        confident from first call to closing.
    - number: '03'
      title: Powerful negotiation
      body: >-
        Three decades of sales & marketing translate into leverage to fiercely
        advocate for your best interests.
