seo:
  title: Jennifer Schumacher — Luxury Real Estate in Scottsdale & Phoenix
  description: >-
    Top 1% Arizona REALTOR® with Russ Lyon Sotheby's International Realty.
    Twenty years of sales and marketing expertise serving Scottsdale, Phoenix,
    Paradise Valley and the greater Valley.
  social_image: /assets/jennifer-portrait.png
hero:
  kicker: Top 1% REALTOR® · Scottsdale · Paradise valley · phoenix
  headline_line1: Arizona real estate,
  headline_emphasis: elevated.
