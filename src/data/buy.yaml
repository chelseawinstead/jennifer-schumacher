seo:
  title: Buy a Home in Scottsdale & Phoenix — Jennifer Schumacher
  description: >-
    A guided path from first showing to closing across Scottsdale, Paradise
    Valley and the greater Phoenix Valley — with early access to inventory and
    negotiation that protects your price and terms.
  social_image: /assets/home-livingroom.jpg
hero:
  kicker: Buy a Home
  headline_line1: From first showing
  headline_line2_prefix: to
  headline_emphasis: front door.
  body: >-
    Buying in Arizona should feel exciting and seamless. I will guide you
    through every step with clear communication, expert insight, and powerful
    negotiation from start to finish.
  button: Start a conversation
  image: /assets/foyer1.jpg
process:
  kicker: How we work together
  heading: A guided path to the right home
  steps:
    - number: '01'
      title: Private consultation.
      body: >-
        We begin with your vision, lifestyle, timing, long-term goals and never
        a checklist.
    - number: '02'
      title: A curated search.
      body: >-
        Every home worth seeing on-market, plus the pre-market and quietly-held
        opportunities my network hears about first.
    - number: '03'
      title: Private showings.
      body: >-
        Discreet, unhurried informative tours arranged entirely around your
        schedule with a printed and bound notebook for every door.
    - number: '04'
      title: Strategic offer.
      body: >-
        Positioned with live market intelligence and negotiated to protect your
        interests. We go for the gold!
    - number: '05'
      title: Due diligence.
      body: >-
        Inspection, appraisal, and title all coordinated and managed end to end.
        Keeping you informed every step of the way.
    - number: '06'
      title: Closing &amp; beyond.
      body: >-
        A seamless close and a relationship that continues long after the keys.
        You will be on the VIP list for our signature yearly events.
image_break:
  image: /assets/home-exterior-sunset.jpg
  image_alt: Arizona luxury home at sunset
  quote: >-
    "The right home is out there. My job is to find it and to make sure you win
    it."
advantage:
  kicker: The advantage
  heading: Why buyers choose Jennifer.
  body: >-
    Thirty years of sales &amp; marketing, the reach of Sotheby's International
    Realty, and a Top 1% track record are all working on your behalf.
  items:
    - title: Master negotiator.
      body: >-
        Three decades of deal-making. I protect your price and your terms, and I
        keep a cool head when the stakes are highest.
    - title: Pulse on the market.
      body: >-
        I track what's listing, selling, and about to move across the Valley so
        you are always a step ahead.
    - title: Local reputation.
      body: >-
        Agents across the Valley know and trust me. That goodwill opens doors,
        smooths deals, and gets my clients to yes.
    - title: Global Sotheby's reach.
      body: >-
        Relocating or investing from afar? The Sotheby's International Realty
        network moves with you. I can assist you anywhere in the world with my
        trusted network.
    - title: Early access to inventory.
      body: >-
        Strong relationships mean I often hear about homes before they're widely
        marketed and get you in first.
    - title: Concierge coordination.
      body: >-
        Inspectors, lenders, designers, movers "My Guys" list is a trusted
        circle managed on your behalf.
team:
  image: /assets/0m4a0027-2.jpg
  image_alt: Jennifer Schumacher and Natalie Congleton
  kicker: Your buyers' team
  heading: Two of us, entirely on your side.
  paragraph1_before: 'You will work directly with me and '
  paragraph1_name: Natalie Congleton
  paragraph1_after: >-
    , our Buyers' Specialist. Together we bring four decades of negotiation, a
    network that hears about homes early, and someone always ready to answer the
    call.
  paragraph2: >-
    In practice, that means a look at homes before they're public, offers
    structured to win without overpaying, and a genuinely seamless experience
    even if you are buying from out of state, sight unseen.
cta:
  kicker: Ready when you are
  heading: Let's see if we are the right fit.
  body: >-
    A relaxed, no-pressure conversation with us about what you are looking for
    and how we can help you get there.
  button_call: Call
  button_text: Text Jennifer
