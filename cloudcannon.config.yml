# =============================================================================
# CloudCannon configuration — Jennifer Schumacher
#
# Defines what Jennifer and her team can edit, and what each field is called in
# plain English. The site itself (Astro + Vercel) is unchanged; this only shapes
# the editing experience.
# =============================================================================

paths:
  static: public
  uploads: public/assets
  # so an uploaded photo is referenced as /assets/filename.jpg, matching the site
  uploads_use_relative_path: false

collections_config:
  pages:
    path: src/data
    glob:
      - "home.yaml"
      - "about.yaml"
      - "buy.yaml"
      - "sell.yaml"
      - "journal.yaml"
      - "listings.yaml"
    name: Pages
    icon: wysiwyg
    description: The content of each page on the site.
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    _enabled_editors:
      - visual
      - data

  # ===========================================================================
  journal:
    path: src/content/journal
    name: The Journal
    icon: article
    description: Blog posts. Use "+ Add" to publish a new one.
    create:
      path: "[relative_base_path]/{title|slugify}.md"
    add_options:
      - name: New journal post
    _enabled_editors:
      - content
      - visual
      - data

  # ===========================================================================
  listings:
    path: src/content/listings
    name: Listings
    icon: home
    description: One page per property. Use "+ Add" for a new listing.
    create:
      path: "[relative_base_path]/{address|slugify}.md"
    add_options:
      - name: New listing
    _enabled_editors:
      - visual
      - data

  settings:
    path: src/data
    glob:
      - "site.yaml"
    name: Contact & footer details
    icon: contact_page
    description: Appears in the header and footer of every page. Change once, updates everywhere.
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
    # site.yaml isn't a page, so point its preview at the homepage — the header
    # and footer she's editing appear there.
    url: "/"
    _enabled_editors:
      - visual
      - data

# -----------------------------------------------------------------------------
# Field labels and help text. `comment` shows as grey helper text under a field.
# -----------------------------------------------------------------------------
_inputs:
  # ---- Search & social ----
  seo:
    type: object
    label: Search & social
    comment: How this page appears in Google and when the link is shared.
  title:
    type: text
    label: Page title
    comment: Shows in the browser tab and as the headline in Google results. Under 60 characters.
  description:
    type: textarea
    label: Search description
    comment: The grey summary under your link in Google. One or two sentences, under 160 characters.
  social_image:
    type: image
    label: Social preview image
    comment: The picture shown when the site is texted or posted to Facebook or Instagram.

  # ---- Hero ----
  hero:
    type: object
    label: Top of the page
  kicker:
    type: text
    label: Small line above the heading
  headline_line1:
    type: text
    label: Headline — first line
  headline_emphasis:
    type: text
    label: Headline — italic word
    comment: Shows in italic navy.
  body:
    type: textarea
    label: Paragraph
  image:
    type: image
    label: Photo
  image_alt:
    type: text
    label: Photo description
    comment: Describes the photo for screen readers and Google.

  # ---- Repeating sections ----
  heading:
    type: text
    label: Section heading
  items:
    type: array
    label: Items
  stats:
    type: array
    label: Numbers band
    comment: The navy strip of statistics. Four fits the layout.
  value:
    type: text
    label: Big number
  number:
    type: text
    label: Number

  # ---- Listings ----
  listings:
    type: object
    label: Featured listings
  price:
    type: text
    label: Price
  address:
    type: text
    label: Street address
    comment: "⚠️ 'Address line' is placeholder text — replace with the real street address before launch."
  city:
    type: text
    label: City & state
  specs:
    type: text
    label: Beds · Baths · Sq ft

  # ---- Communities ----
  communities:
    type: object
    label: Featured cities
  placeholder:
    type: text
    label: Placeholder caption
    comment: Shown on the grey striped box until a photo is added.
  blurb:
    type: textarea
    label: Short description
  badge:
    type: text
    label: Badge text
  sub:
    type: text
    label: Small caption
  span:
    type: switch
    label: Double width?

  # ---- Reviews ----
  testimonials:
    type: object
    label: Reviews
  quote:
    type: textarea
    label: Quote
  author:
    type: text
    label: Client name
  rating_line:
    type: text
    label: Rating line
  reviews_url:
    type: text
    label: Google reviews link
  reviews_cta:
    type: text
    label: Button text

  # ---- About page ----
  paragraphs:
    type: array
    label: Paragraphs
    comment: Add or remove paragraphs freely.
  areas:
    type: object
    label: Areas you cover
  names:
    type: array
    label: Community names
    comment: Shown as a row across the bottom. Six fits neatly.
  philosophy:
    type: object
    label: Philosophy quote
  awards:
    type: array
    label: Awards band
  fun_facts:
    type: object
    label: "Off the clock"
  team:
    type: object
    label: The team
  members:
    type: array
    label: Team member cards
  support:
    type: array
    label: Support team
  headshot:
    type: image
    label: Headshot
    comment: Shown as a small circle. A face-centred crop works best.
  role:
    type: text
    label: Title / credentials
  background_image:
    type: image
    label: Background photo
    comment: Full-width photo behind this section, darkened automatically.

  # ---- Site-wide ----
  name:
    type: text
    label: Name
  brokerage:
    type: text
    label: Brokerage
  brokerage_disclosure:
    type: textarea
    label: Brokerage disclosure
  phone_display:
    type: text
    label: Phone (as shown)
  phone_link:
    type: text
    label: Phone (digits only)
    comment: Used for tap-to-call and tap-to-text. Digits only, including the leading 1.
  email:
    type: text
    label: Email
  address_line1:
    type: text
    label: Office address
  address_line2:
    type: text
    label: City, state, ZIP
  license_number:
    type: text
    label: Arizona license number
    comment: "⚠️ REQUIRED BEFORE LAUNCH. Currently the placeholder SA000000. Arizona advertising rules require the real ADRE number."
  footer_blurb:
    type: textarea
    label: Footer paragraph
  copyright_year:
    type: text
    label: Copyright year
  nav:
    type: array
    label: Main menu
    comment: Drag to reorder the menu across the top of the site.
  footer_nav:
    type: array
    label: Footer menu
  label:
    type: text
    label: Label
  href:
    type: text
    label: Links to
  cta:
    type: text
    label: Link text
  link_label:
    type: text
    label: Link text
  link_href:
    type: text
    label: Link goes to

  # ---- Buy page ----
  process:
    type: object
    label: The process
  steps:
    type: array
    label: Steps
    comment: Drag to reorder. Each step shows its number, title and description.
  button:
    type: text
    label: Button text
  image_break:
    type: object
    label: Full-width photo band
  advantage:
    type: object
    label: The advantage
  headline_line2_prefix:
    type: text
    label: Headline — second line lead-in
    comment: The small words before the italic phrase.
  headline_before:
    type: text
    label: Headline — lead-in
  paragraph1_before:
    type: text
    label: Paragraph — before the name
  paragraph1_name:
    type: text
    label: Paragraph — highlighted name
  paragraph1_after:
    type: textarea
    label: Paragraph — after the name
  paragraph2:
    type: textarea
    label: Second paragraph

  # ---- Sell page ----
  positioning:
    type: object
    label: Opening statement
  statement:
    type: textarea
    label: Statement
  included:
    type: object
    label: "What's included"
  pillars:
    type: array
    label: Pillars
    comment: Six fits the three-column layout neatly.
  intro:
    type: textarea
    label: Intro paragraph
  cards:
    type: array
    label: Cards
  showcase:
    type: object
    label: Marketing showcase
  attribution:
    type: text
    label: Client name & rating
  footnote:
    type: textarea
    label: Closing note
  review:
    type: object
    label: Featured review
  stars:
    type: text
    label: Star rating
  button_primary:
    type: text
    label: Main button text
  button_secondary:
    type: text
    label: Second button text

  # ---- The Journal ----
  kicker:
    type: text
    label: Small line above the heading
  category:
    type: text
    label: Category
    comment: Shown above the title, e.g. "Neighborhood guide".
  excerpt:
    type: textarea
    label: Short summary
    comment: Appears on the Journal index and when the post is shared.
  lede:
    type: textarea
    label: Opening line
    comment: The large italic sentence before the article body.
  image_caption:
    type: text
    label: Photo caption
  author:
    type: text
    label: Author
  read_time:
    type: text
    label: Read time
    comment: e.g. "5 min read"
  date:
    type: date
    label: Date published
  featured:
    type: switch
    label: Feature this at the top?
    comment: Only one should be featured at a time.
  published:
    type: switch
    label: Visible on the site?
    comment: Turn off to hide without deleting.

  # ---- Listings ----
  status:
    type: text
    label: Status
    comment: e.g. "For sale", "New construction", "Under contract".
  beds:
    type: text
    label: Bedrooms
  baths:
    type: text
    label: Bathrooms
  sqft:
    type: text
    label: Interior size
    comment: e.g. "5,338 sf"
  lot:
    type: text
    label: Lot size
  garage:
    type: text
    label: Car garage
    comment: Number of garage spaces, e.g. "3". Leave blank to hide.
  year_built:
    type: text
    label: Year built
  gallery:
    type: array
    label: Photo gallery
    comment: Add as many photos as you like. Drag to reorder.
    options:
      structures: _structures.gallery_photo
  caption:
    type: text
    label: Caption
  order:
    type: number
    label: Sort order
    comment: Lower numbers appear first on the Listings page.

  # ---- Buttons & footer wording ----
  buttons:
    type: object
    label: Button wording
    comment: The words on buttons across the site. The links themselves never change.
  call:
    type: text
    label: "\"Call\" button text"
  text:
    type: text
    label: "\"Text\" button text"
  call_prefix:
    type: text
    label: Call button lead-in
    comment: The word before the phone number, e.g. "Call ".
  contact:
    type: text
    label: Header contact button
  footer_headings:
    type: object
    label: Footer column headings
  explore:
    type: text
    label: Menu column heading
  brokerage_heading:
    type: text
    label: Brokerage column heading

  # ---- Web address ----
  slug:
    type: text
    label: Web address
    comment: >-
      The end of this page's link, e.g. "a-locals-guide-to-arcadia" becomes
      /journal/a-locals-guide-to-arcadia. Lowercase, use hyphens instead of
      spaces. Leave blank to use the file name. Changing this breaks any
      existing links to the page.

# -----------------------------------------------------------------------------
# Shapes for "Add" buttons inside arrays
# -----------------------------------------------------------------------------
_structures:
  gallery_photo:
    values:
      - label: Photo
        icon: image
        value:
          image: ""
          caption: ""
