# The form Jennifer's team uses to publish listings and Little Black Book posts.
#
# Every field here writes into content/listings/<address>.yml, which the build
# pours into the listing template from Jennifer's Claude Design document. This
# file decides what the team is asked for; it never decides how a page looks.

backend:
  name: github
  repo: chelseawinstead/jennifer-schumacher
  branch: main
  # Set this to the Cloudflare worker that handles "Sign in with GitHub".
  base_url: https://REPLACE-ME.workers.dev

# Photos the team uploads. The build re-encodes everything here down to 2000px
# and copies it to /images, so a 6MB photo off a camera lands the right size.
media_folder: content/images
public_folder: ""

publish_mode: simple
site_url: https://www.schumacherliving.com

collections:
  - name: listings
    label: Listings
    label_singular: Listing
    folder: content/listings
    extension: yml
    format: yaml
    create: true
    # No Delete button on purpose: Archived takes a listing off the site
    # completely and is reversible, which is what "delete" almost always means
    # here. Nothing is ever destroyed by someone in a hurry.
    delete: false
    slug: "{{street}}"
    identifier_field: street
    # The state leads, so it is obvious at a glance which listings are live.
    summary: "{{state}}  ·  {{street}}, {{city}} — {{price}}"
    # Listings show newest-priciest first on the site; the order here is just
    # for finding things.
    sortable_fields: [street, city, price, status, state]
    fields:
      - { name: state, label: Where this listing is, widget: select, default: Draft,
          options: [Draft, Published, Archived],
          hint: "Draft — still being written, never been on the site. Published — live. Archived — taken down, but everything is kept and it can go back up in one click." }
      - { name: featured, label: Feature this one at the top of the Listings page,
          widget: boolean, default: false,
          hint: "The big photo at the top of the Listings page. Only one listing should have this switched on." }
      - { name: status, label: Status, widget: select, default: For sale,
          options: [For sale, Under contract, Sold] }
      - { name: price, label: Price, widget: string,
          hint: "e.g. $1,200,000 — typing 1200000 is fine too, it gets tidied up" }
      - { name: street, label: Street address, widget: string,
          hint: "Number and street — 4945 E Mountain View Road. Add a unit here too if there is one." }
      - { name: city, label: City, widget: string, hint: "Paradise Valley" }
      - { name: state_code, label: State, widget: string, default: AZ }
      - { name: zip, label: ZIP, widget: string, required: false }
      - { name: lede, label: One-line intro, widget: string,
          hint: "The single italic line under the price" }

      - name: figures
        label: The figures under the price
        widget: object
        hint: "The row that reads 4 · Bedrooms · 4.5 · Bathrooms and so on, across the top of the listing page."
        fields:
          - { name: bedrooms, label: Bedrooms, widget: string,
              hint: "Just the number — 4" }
          - { name: bathrooms, label: Bathrooms, widget: string,
              hint: "Just the number — 4.5" }
          - { name: interior, label: Interior, widget: string,
              hint: "Square footage, written how it should look — 3,979 sf" }
          - { name: lot, label: Lot, widget: string, required: false,
              hint: "Square footage — 44,853 sf. Leave blank and no Lot figure appears." }
          - { name: garage, label: Garage, widget: string,
              hint: "Just the number — 4. It shows on the page as 4 Car Garage." }

      - name: hero
        label: Main photo
        widget: object
        hint: "The wide photo at the top of the listing's own page"
        fields:
          - { name: src, label: Photo, widget: image }

      - name: cardart
        label: Other photos and labels
        widget: object
        collapsed: true
        hint: "All optional. Leave these alone and the main photo is used everywhere."
        fields:
          - { name: card, label: Photo for the Listings page, widget: image, required: false }
          - { name: card_home, label: Photo for the homepage, widget: image, required: false }
          - { name: kicker, label: Line above the price when featured, widget: string,
              required: false, hint: "e.g. New construction · Paradise Valley" }
          - { name: card_kicker, label: Line above the price on its card, widget: string,
              required: false, hint: "The city, unless you write something else" }

      - { name: film, label: Property film, widget: string, required: false,
          hint: "Paste the YouTube link — the one from the address bar or the Share button. Leave it blank and no play button appears." }

      - { name: body, label: Description, widget: text,
          hint: "Leave a blank line between paragraphs" }

      - name: gallery
        label: Photos
        label_singular: Photo
        widget: list
        summary: "{{fields.caption}}"
        fields:
          - { name: src, label: Photo, widget: image }
          - { name: caption, label: Caption, widget: string, required: false,
              hint: "Shown under the photo. Leave blank for no caption." }

      - name: seo
        label: Page title and search listing
        widget: object
        collapsed: true
        hint: "Filled in automatically. Only worth opening to override it."
        fields:
          - { name: slug, label: Web address, widget: string, required: false }
          - { name: title, label: Browser tab title, widget: string, required: false }
          - { name: meta_description, label: Search description, widget: string, required: false }

  # ------------------------------------------------------------------------
  # The Little Black Book
  #
  # Every post writes content/journal/<web-address>.yml. The build pours it
  # into the post page from Jennifer's Claude Design document, and rebuilds the
  # Little Black Book page and the "More from" row under every post. The file
  # name is the web address, taken from the title when the post is created,
  # and it never changes afterwards, so rewording a title never breaks a link.
  # ------------------------------------------------------------------------
  - name: journal
    label: Little Black Book
    label_singular: Post
    folder: content/journal
    extension: yml
    format: yaml
    create: true
    # Same as listings: Archived takes a post down and keeps every word.
    delete: false
    slug: "{{title}}"
    identifier_field: title
    summary: "{{state}}  ·  {{title}}  ·  {{place}}"
    sortable_fields: [date, title, place, state]
    fields:
      - { name: state, label: Where this post is, widget: select, default: Draft,
          options: [Draft, Published, Archived],
          hint: "Draft — still being written, never been on the site. Published — live. Archived — taken down, but everything is kept and it can go back up in one click." }
      - { name: featured, label: Feature this one at the top of the Little Black Book page,
          widget: boolean, default: false,
          hint: "The big block at the top of the page. Only one post should have this switched on. If none do, the newest post goes there." }
      - { name: date, label: Date, widget: datetime, time_format: false,
          format: YYYY-MM-DD, date_format: "MMM D, YYYY", default: "{{now}}",
          hint: "Newest posts show first. The date isn't printed on the page." }
      - { name: title, label: Headline, widget: string,
          hint: "As it should read on the page — A weekend in Scottsdale. The web address is made from this when you first save, and stays the same after." }
      - { name: category, label: Kind of post, widget: string, default: Neighborhood guide,
          hint: "The small line at the top — Neighborhood guide, Market update, Dining…" }
      - { name: place, label: Place, widget: string, required: false,
          hint: "The blue line above the headline, and the label on the post's card — Arcadia · Phoenix" }
      - { name: intro, label: One- or two-line intro, widget: text,
          hint: "Under the headline, and on the post's card on the Little Black Book page." }

      - name: hero
        label: Main photo
        widget: object
        hint: "The wide photo at the top of the post. It's also the photo on the post's card."
        fields:
          - { name: src, label: Photo, widget: image }
          - { name: caption, label: Caption, widget: string, required: false,
              hint: "Small grey line under the photo. Leave blank for none." }

      - { name: lede, label: Opening line, widget: text, required: false,
          hint: "Optional. The large italic sentence that starts the article." }

      - { name: body, label: The article, widget: markdown,
          modes: [rich_text], minimal: false,
          buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list],
          editor_components: [image],
          hint: "Write it the way you'd write an email. Use Heading 2 for sections like Morning / Afternoon / Evening. Photos can be dropped in anywhere." }

      - { name: author, label: Written by, widget: string, default: Jennifer Schumacher }
      - { name: read_time, label: Minutes to read, widget: string, required: false,
          hint: "Leave blank and it's worked out from the length of the article." }

      - name: photo_tuning
        label: Photo fine-tuning
        widget: object
        collapsed: true
        required: false
        hint: "All optional. Only worth opening if a photo is cropped badly."
        fields:
          - { name: alt, label: Describe the photo, widget: string, required: false,
              hint: "Read aloud to people using screen readers, and used by Google. The caption or the place is used if this is blank." }
          - { name: zoom, label: Zoom into the main photo, widget: select, required: false,
              options: [{ label: "None", value: "" }, { label: "A little", value: "1.2" },
                        { label: "More", value: "1.4" }, { label: "A lot", value: "1.6" }] }
          - { name: focus, label: Which part of the photo to keep on the small card, widget: select,
              required: false,
              options: [{ label: "Middle", value: "" }, { label: "Top", value: "center 20%" },
                        { label: "Bottom", value: "center 80%" }] }

      - name: seo
        label: Browser tab and Google listing
        widget: object
        collapsed: true
        required: false
        hint: "Filled in automatically from the headline and intro. Only worth opening to override them."
        fields:
          - { name: seo_title, label: Browser tab title, widget: string, required: false,
              hint: "\" | The Little Black Book\" is added to the end automatically." }
          - { name: meta_description, label: Google description, widget: string, required: false }
