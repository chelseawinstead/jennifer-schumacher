# -----------------------------------------------------------------------------
# Sveltia CMS — what Jennifer sees at /admin
# Every `hint` below appears as grey helper text under the field in her editor.
# -----------------------------------------------------------------------------
backend:
  name: github
  repo: chelseawinstead/jennifer-schumacher
  branch: astro-conversion
  # OAuth client (free Cloudflare Worker) — set once, then never touched:
  base_url: https://sveltia-cms-auth.chelsearwinstead.workers.dev

publish_mode: simple

media_folder: public/assets
public_folder: /assets

collections:
  # ===========================================================================
  - name: pages
    label: Pages
    editor:
      preview: false   # replaced by the docked live-site panel in preview.js
    files:
      # -----------------------------------------------------------------------
      - name: home
        label: Home page
        file: src/data/home.yaml
        description: Everything on the homepage — headline, photos, listings, reviews.
        fields:
          - name: seo
            label: Search & social
            widget: object
            collapsed: true
            fields:
              - name: title
                label: Page title
                widget: string
                hint: Shows in the browser tab and as the headline in Google results. Aim for under 60 characters.
              - name: description
                label: Search description
                widget: text
                hint: The grey summary under your link in Google. One or two sentences, under 160 characters.
              - name: social_image
                label: Social preview image
                widget: image
                hint: The picture that appears when your site is texted or posted to Facebook or Instagram. Landscape works best.

          - name: hero
            label: Top of the page
            widget: object
            fields:
              - { name: kicker, label: Small line above the headline, widget: string }
              - { name: headline_line1, label: Headline — first line, widget: string }
              - name: headline_emphasis
                label: Headline — italic word
                widget: string
                hint: This part shows in italic navy. Currently "elevated."
              - { name: body, label: Intro paragraph, widget: text }
              - name: image
                label: Your photo
                widget: image
                hint: Portrait orientation. This is the large photo beside the headline.
              - { name: image_alt, label: Photo description, widget: string, hint: "Describes the photo for screen readers and Google. e.g. 'Jennifer Schumacher'" }

          - name: why
            label: "Why work with Jennifer"
            widget: object
            collapsed: true
            fields:
              - { name: kicker, label: Small line above, widget: string }
              - { name: heading, label: Section heading, widget: string }
              - name: items
                label: Reasons
                widget: list
                summary: "{{fields.number}} — {{fields.title}}"
                fields:
                  - { name: number, label: Number, widget: string }
                  - { name: title, label: Title, widget: string }
                  - { name: body, label: Description, widget: text }

          - name: stats
            label: Numbers band
            widget: list
            collapsed: true
            summary: "{{fields.value}} — {{fields.label}}"
            hint: The navy strip of statistics. Keep to four.
            fields:
              - { name: value, label: Big number, widget: string }
              - { name: label, label: Caption underneath, widget: string }

          - name: communities
            label: Featured communities
            widget: object
            collapsed: true
            fields:
              - { name: kicker, label: Small line above, widget: string }
              - { name: heading, label: Section heading, widget: string }
              - { name: link_label, label: Link text, widget: string }
              - { name: link_href, label: Link goes to, widget: string }
              - name: featured
                label: Large tile
                widget: object
                fields:
                  - name: image
                    label: Photo
                    widget: image
                    required: false
                    hint: "⚠️ Empty right now — the tile shows a grey striped placeholder until you add a photo."
                  - { name: placeholder, label: Placeholder caption, widget: string, required: false }
                  - { name: badge, label: Badge text, widget: string }
                  - { name: name, label: Community name, widget: string }
                  - { name: blurb, label: Short description, widget: text }
                  - { name: cta, label: Link text, widget: string }
                  - { name: href, label: Link goes to, widget: string }
              - name: others
                label: Smaller tiles
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - name: image
                    label: Photo
                    widget: image
                    required: false
                    hint: "⚠️ Empty right now — shows a grey striped placeholder until you add a photo."
                  - { name: placeholder, label: Placeholder caption, widget: string, required: false }
                  - { name: name, label: Community name, widget: string }
                  - { name: sub, label: Small caption, widget: string }
                  - { name: href, label: Link goes to, widget: string }
                  - { name: span, label: Double width?, widget: boolean, default: false }

          - name: listings
            label: Featured listings
            widget: object
            collapsed: true
            fields:
              - { name: kicker, label: Small line above, widget: string }
              - { name: heading, label: Section heading, widget: string }
              - { name: link_label, label: Link text, widget: string }
              - { name: link_href, label: Link goes to, widget: string }
              - name: items
                label: Properties
                widget: list
                summary: "{{fields.price}} — {{fields.address}}, {{fields.city}}"
                fields:
                  - { name: price, label: Price, widget: string }
                  - name: address
                    label: Street address
                    widget: string
                    hint: "⚠️ Placeholder — 'Address line' must be replaced with the real street address before launch."
                  - { name: city, label: City & state, widget: string }
                  - { name: specs, label: Beds · Baths · Sq ft, widget: string }
                  - { name: image, label: Photo, widget: image }
                  - { name: href, label: Links to, widget: string }

          - name: testimonials
            label: Reviews
            widget: object
            collapsed: true
            fields:
              - { name: kicker, label: Small line above, widget: string }
              - { name: heading, label: Section heading, widget: string }
              - { name: rating_line, label: Rating line, widget: string }
              - { name: reviews_url, label: Google reviews link, widget: string }
              - { name: reviews_cta, label: Button text, widget: string }
              - name: items
                label: Quotes
                widget: list
                summary: "{{fields.author}}"
                fields:
                  - { name: quote, label: Quote, widget: text }
                  - { name: author, label: Client name, widget: string }

          - name: affiliations
            label: Affiliations & recognition
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Small line above, widget: string }
              - { name: serif, label: Brand names (serif), widget: list, field: { name: item, label: Name, widget: string } }
              - { name: plain, label: Awards (small caps), widget: list, field: { name: item, label: Award, widget: string } }

          - name: cta
            label: Bottom contact block
            widget: object
            collapsed: true
            fields:
              - { name: image, label: Photo, widget: image }
              - { name: kicker, label: Small line above, widget: string }
              - { name: heading, label: Headline, widget: string }
              - { name: body, label: Paragraph, widget: text }

      # -----------------------------------------------------------------------
      - name: about
        label: About page
        file: src/data/about.yaml
        description: Jennifer's story, the areas she covers, the team, and the off-the-clock photos.
        fields:
          - name: seo
            label: Search & social
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Page title, widget: string, hint: "Shows in the browser tab and in Google results. Under 60 characters." }
              - { name: description, label: Search description, widget: text, hint: "The grey summary under your link in Google. Under 160 characters." }
              - { name: social_image, label: Social preview image, widget: image, hint: "Shown when this page is texted or posted to social." }

          - name: hero
            label: Top of the page
            widget: object
            fields:
              - { name: kicker, label: Small line above the headline, widget: string }
              - { name: headline_line1, label: Headline — first line, widget: string }
              - { name: headline_emphasis, label: Headline — italic word, widget: string, hint: "Shows in italic navy. Currently \"people.\"" }
              - { name: body, label: Intro paragraph, widget: text }
              - { name: image, label: Your photo, widget: image, hint: "Portrait orientation, beside the headline." }
              - { name: image_alt, label: Photo description, widget: string }

          - name: why
            label: "Why real estate"
            widget: object
            collapsed: true
            fields:
              - { name: kicker, label: Small line above, widget: string }
              - { name: heading, label: Section heading, widget: string }
              - name: paragraphs
                label: Paragraphs
                widget: list
                field: { name: text, label: Paragraph, widget: text }
                hint: Your story, in your own words. Add or remove paragraphs freely.

          - name: areas
            label: Areas you cover
            widget: object
            collapsed: true
            fields:
              - { name: background_image, label: Background photo, widget: image, hint: "Full-width photo behind this section, darkened automatically." }
              - { name: kicker, label: Small line above, widget: string }
              - { name: heading, label: Section heading, widget: string }
              - { name: body, label: Paragraph, widget: text }
              - name: names
                label: Community names
                widget: list
                field: { name: name, label: Community, widget: string }
                hint: Shown as a row across the bottom. Six fits neatly; more will get tight.

          - name: philosophy
            label: Philosophy quote
            widget: object
            collapsed: true
            fields:
              - { name: kicker, label: Small line above, widget: string }
              - { name: quote, label: Quote, widget: text, hint: "Large italic quote. Include the quotation marks." }

          - name: awards
            label: Awards band
            widget: list
            collapsed: true
            summary: "{{fields.value}} — {{fields.label}}"
            hint: The navy strip. Three fits the layout.
            fields:
              - { name: value, label: Big text, widget: string }
              - { name: label, label: Caption underneath, widget: string }

          - name: fun_facts
            label: "Off the clock"
            widget: object
            collapsed: true
            fields:
              - { name: kicker, label: Small line above, widget: string }
              - { name: heading, label: Section heading, widget: string }
              - name: items
                label: Cards
                widget: list
                summary: "{{fields.title}}"
                hint: Four fits the row. Portrait photos work best.
                fields:
                  - { name: image, label: Photo, widget: image }
                  - { name: title, label: Title, widget: string }
                  - { name: body, label: Short description, widget: text }

          - name: team
            label: The team
            widget: object
            collapsed: true
            fields:
              - { name: kicker, label: Small line above, widget: string }
              - { name: heading, label: Section heading, widget: string }
              - { name: intro, label: Intro paragraph, widget: text }
              - { name: photo, label: Team photo, widget: image }
              - { name: photo_alt, label: Team photo description, widget: string }
              - name: members
                label: Team member cards
                widget: list
                summary: "{{fields.name}} — {{fields.role}}"
                fields:
                  - { name: headshot, label: Headshot, widget: image, hint: "Shown as a small circle. Face centred works best." }
                  - { name: name, label: Name, widget: string }
                  - { name: role, label: Title / credentials, widget: string }
                  - name: paragraphs
                    label: Bio paragraphs
                    widget: list
                    field: { name: text, label: Paragraph, widget: text }
              - name: support
                label: Support team (name + role only)
                widget: list
                summary: "{{fields.name}} — {{fields.role}}"
                hint: The smaller row underneath. No photos.
                fields:
                  - { name: name, label: Name, widget: string }
                  - { name: role, label: Role, widget: string }

          - name: cta
            label: Bottom contact block
            widget: object
            collapsed: true
            fields:
              - { name: kicker, label: Small line above, widget: string }
              - { name: heading, label: Headline, widget: string }
              - { name: body, label: Paragraph, widget: text }
              - { name: image, label: Photo, widget: image }

      # -----------------------------------------------------------------------
      - name: site
        label: Contact & footer details
        file: src/data/site.yaml
        description: Appears in the header and footer of EVERY page. Change once, updates everywhere.
        fields:
          - { name: name, label: Full name, widget: string }
          - { name: brokerage, label: Brokerage, widget: string }
          - { name: brokerage_disclosure, label: Brokerage disclosure, widget: text }
          - { name: phone_display, label: Phone (as shown), widget: string }
          - name: phone_link
            label: Phone (digits only)
            widget: string
            pattern: ['^[0-9]{11}$', 'Digits only, including the leading 1. Example: 14803222593']
            hint: Used for the tap-to-call and tap-to-text links. Digits only, no spaces or dashes.
          - { name: email, label: Email, widget: string }
          - { name: address_line1, label: Office address, widget: string }
          - { name: address_line2, label: City, state, ZIP, widget: string }
          - name: license_number
            label: Arizona license number
            widget: string
            pattern: ['^(?!SA000000$)[A-Za-z]{2}[0-9]{6,}$', 'SA000000 is placeholder text — enter the real ADRE license number.']
            hint: "⚠️ REQUIRED BEFORE LAUNCH. Currently shows the placeholder SA000000. Arizona advertising rules require the real ADRE number on the site."
          - { name: footer_blurb, label: Footer paragraph, widget: text }
          - { name: copyright_year, label: Copyright year, widget: string }
          - name: nav
            label: Main menu
            widget: list
            collapsed: true
            summary: "{{fields.label}}"
            hint: Drag to reorder the menu across the top of the site.
            fields:
              - { name: label, label: Menu text, widget: string }
              - { name: href, label: Goes to, widget: string }
          - name: footer_nav
            label: Footer menu
            widget: list
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Menu text, widget: string }
              - { name: href, label: Goes to, widget: string }
