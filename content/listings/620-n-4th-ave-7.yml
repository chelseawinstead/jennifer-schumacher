body: |-
  Updated downtown Phoenix condo with a refined, modern feel. The kitchen features industrial and modern finishes with granite countertops, complemented by stained and polished concrete floors throughout the living area. An in-unit washer and dryer add everyday convenience. Enjoy a private patio with views of the city, creating an inviting space to take in the downtown skyline. 

  The central location offers easy access to dining, shopping, entertainment, Sky Harbor International Airport, the light rail, and the best downtown lifestyle Phoenix has to offer. With modern updates, thoughtful details, and an ideal urban location, this rare, 3 bedroom, 3 bathroom condo puts the best of the city within easy reach.

  Contact Jennifer for full details and a private showing.
