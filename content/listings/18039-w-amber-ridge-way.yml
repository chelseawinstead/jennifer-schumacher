body: |-
  Enjoy Arizona sunshine and resort-style living at CantaMia at Estrella, a guard-gated Active Adult community. Meticulously maintained by its original owner, this inviting home offers an open floor plan ideal for relaxed living and entertaining, a modern kitchen, and a private primary retreat with dual vanities and a spacious walk-in shower. A laundry room with abundant storage adds everyday convenience. 

  Outside, take in stunning mountain views from your low-maintenance backyard perfect for enjoying more time outdoors. Whether you’re seeking a winter escape or a year-round home, CantaMia makes it easy to stay active and connected with indoor and outdoor pools, fitness facilities, yoga, pickleball, tennis, an art studio, a café, and scenic walking trails. Your next chapter starts under the Arizona sun.

  Contact Jennifer for full details and a private showing.
