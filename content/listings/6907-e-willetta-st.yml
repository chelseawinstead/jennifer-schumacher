body: |-
  Designed for effortless Arizona living, this fully remodeled Scottsdale retreat is ideal as an Airbnb, second home, or investment property. The open-concept living, dining, and kitchen areas flow through expansive sliding glass doors to a private backyard and sparkling pool. 

  The stylish kitchen features modern appliances, granite waterfall countertops, and generous storage. The spacious primary suite offers a spa-inspired bath with a soaking tub, walk-in shower, six showerheads, dual sinks, and designer tile.

  Remodeled in 2022 with on-trend finishes throughout, the home is minutes from Old Town Scottsdale, ASU, Sky Harbor Airport, spring training, dining, shopping, and entertainment.

  Contact Jennifer for full details and a private showing.
