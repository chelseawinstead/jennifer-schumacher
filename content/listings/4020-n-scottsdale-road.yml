body: |
  Contemporary loft-style studio in a boutique 21-unit building located in the heart of Old Town Scottsdale. This open-concept residence features stainless steel appliances, concrete countertops, and wood flooring. Floor-to-ceiling windows bring in natural light and connect to a private patio with views of Camelback Mountain. The building's central location offers convenient access to nearby dining, shopping, entertainment, and recreational options, providing an ideal setting for urban living in Old Town.

  Contact Jennifer for full details and a private showing.
