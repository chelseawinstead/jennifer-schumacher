body: |-
  Enjoy effortless lock-and-leave living in Seville, where beautiful views and resort-style amenities create an exceptional Arizona lifestyle. Set along the golf course, this light-filled home features an open-concept design and desirable split floor plan, ideal for both everyday comfort and entertaining. The primary suite offers a spa-inspired bath with dual vanities, a freestanding tub and walk-in shower. Outside, relax beneath the covered patio, enjoy the heated pool or practice on the putting green, all framed by golf course and mountain views. With convenient access to golf, tennis, pickleball, dining, shopping and everyday essentials, this is the perfect home to simply lock, leave and enjoy.

  Contact Jennifer for full details and a private showing.
