body: |-
  If you have been dreaming of a quieter pace in Queen Creek, this is it. Located behind the gates of the Cielo Noche community, this home offers the privacy, peace, and beautiful mountain views that make this area so special. Inside, an open-concept layout is made for everyday living and easy entertaining. 

  The spacious kitchen features upgraded stainless steel appliances, a butler's pantry, and a walk-in pantry. The expansive primary suite is on the main floor, so the home lives like a single story, with an en-suite bath featuring a double vanity, walk-in shower, and soaking tub. Upstairs, a versatile loft gives you a second living area, perfect for kids, guests, or movie nights. 

  Multi-slide glass doors open to a private backyard oasis with a heated pool, travertine decking, covered patio, pergola, and lush landscaping, made for sunset views and quiet evenings at home. And when you want to get out, Queen Creek Marketplace is close by for shopping, dining, and entertainment.

  Contact Jennifer for full details and a private showing.
